
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منزّل الفيديوهات | عبد الرحمن الطيب</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;color:#fff;
background:linear-gradient(145deg,#07111f,#153453);
min-height:100vh;padding:22px
}
main{max-width:520px;margin:25px auto;text-align:center}
.logo{font-size:60px}
h1{color:#ffb52e;font-size:29px}
p{line-height:1.9;color:#d2dceb}
.card{
margin-top:25px;padding:22px;border-radius:22px;
background:#ffffff0d;border:1px solid #ffffff25
}
label{display:block;text-align:right;margin-bottom:10px}
input{
width:100%;padding:15px;border-radius:12px;
border:1px solid #536780;background:#091525;
color:white;font-size:15px;direction:ltr
}
button{
width:100%;padding:15px;margin-top:14px;
border:0;border-radius:12px;font-size:17px;
font-weight:bold;background:linear-gradient(90deg,#ff8b00,#ffc247);
cursor:pointer
}
#message{overflow-wrap:anywhere}
footer{font-size:13px;color:#aebdd0;margin-top:25px}
</style>
</head>
<body>
<main>
<div class="logo">⬇️</div>
<h1>منزّل الفيديوهات</h1>
<p>ضع رابط الفيديو للبدء</p>
<p><b>المطور عبد الرحمن الطيب</b></p>

<section class="card">
<label for="url">رابط الفيديو</label>
<input id="url" type="url" placeholder="ألصق رابط الفيديو هنا">
<button onclick="checkLink()">فحص الرابط</button>
<p id="message" aria-live="polite">
أدخل رابطًا ثم اضغط فحص الرابط.
</p>
</section>

<footer>
هذه الواجهة تحتاج إلى خدمة خلفية متوافقة
لتنزيل الفيديوهات من منصات التواصل.
نزّل المحتوى الذي تملكه أو لديك إذن بتنزيله.
</footer>
</main>

<script>
function checkLink(){
 const field=document.getElementById('url');
 const message=document.getElementById('message');
 try{
  const link=new URL(field.value.trim());
  if(!['https:','http:'].includes(link.protocol)) throw Error();
  message.textContent=
  'الرابط صحيح من حيث الصيغة. لم يتم تنزيل الفيديو بعد؛ يجب ربط الموقع بخدمة خلفية.';
 }catch(e){
  message.textContent='أدخل رابطًا صحيحًا يبدأ بـ https://';
 }
}
</script>
</body>
</html>
